<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mystery Maccabi 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<style>
:root{--bg:#f6f8fc;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#e3e8f1;--blue:#2457c5;--blue2:#e8effc;--gold:#c98a00;--gold2:#fff6dc;--ok:#1a7f4b;--ok2:#e5f4ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
header{text-align:center;padding:10px 0 6px}
h1{font-size:28px;margin:0 0 6px;color:var(--blue)}
.facts{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px}
h2{font-size:18px;margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.fam{margin:14px 0 6px;color:var(--mute);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px}
button:hover{border-color:var(--blue)}
.pick{font-weight:600}
.pick small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600;padding:12px 18px}
.primary:hover{filter:brightness(1.08)}
.link{border:0;background:none;color:var(--blue);padding:4px;text-decoration:underline}
.hello{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hello b{font-size:20px}
.dcard h3{margin:0 0 4px;font-size:17px}
.dcard .sub{color:var(--mute);font-size:14px;margin-bottom:12px}
.slot{font-size:30px;font-weight:800;text-align:center;padding:18px 8px;border-radius:12px;background:var(--gold2);color:var(--gold);min-height:82px;display:flex;align-items:center;justify-content:center}
.slot.done{background:var(--ok2);color:var(--ok)}
.slot.spin{color:#b9a36a}
.wishview{margin-top:10px;background:var(--blue2);border-radius:10px;padding:10px 12px;font-size:15px;white-space:pre-wrap}
.wishview.empty{background:#f2f4f7;color:var(--mute)}
textarea{width:100%;min-height:80px;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.saved{color:var(--ok);font-size:14px}
.status{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:3px 10px;font-size:14px;background:#f2f4f7;color:var(--mute)}
.chip.y{background:var(--ok2);color:var(--ok)}
.note{color:var(--mute);font-size:14px}
.err{color:#b42318}
.confetti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
</style>
</head>
<body>
<main>
<header>
  <h1>✨ Mystery Maccabi 2026 ✨</h1>
  <div class="facts">
    <span class="fact">📅 Motzash, Saturday 5 December 2026</span>
    <span class="fact">💸 Max ₪15</span>
  </div>
</header>
<div id="app"><p class="note" style="text-align:center">Loading…</p></div>
</main>
<script>
const SB = 'https://ahomwnlimuxinttwrikr.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFob213bmxpbXV4aW50dHdyaWtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjI5MTUsImV4cCI6MjA4OTIzODkxNX0.B5y9pilGpPM2xxkC30nZfJhUKOPFI8ELSZjbYF5HNeM';

const P = {
  josh: { name: 'Saba', sub: 'Josh' }, esti: { name: 'Savti', sub: 'Esti' },
  efrat: { name: 'Efrat' }, aryeh: { name: 'Aryeh' },
  abigail: { name: 'Abigail' }, chesky: { name: 'Chesky' },
  rina: { name: 'Rina' }, yoni: { name: 'Yoni' },
  hagai: { name: 'Hagai' }, orlee: { name: 'Orlee' },
  yishai: { name: 'Yishai' }, yoav: { name: 'Yoav' }, ayelet: { name: 'Ayelet' }, judah: { name: 'Judah' }, talia: { name: 'Talia' },
  gavriel: { name: 'Gavriel' }, eliora: { name: 'Eliora' }, yosefy: { name: 'Yosef Yehoshua' },
  ariel: { name: 'Ariel' }, amitai: { name: 'Amitai' }, eden: { name: 'Eden' },
  mia: { name: 'Mia' }, yael: { name: 'Yael' }, yair: { name: 'Yair' },
  tzuri: { name: 'Yosef Tzuri' }, benaya: { name: 'Benaya' }
};
const FAMS = [
  { label: 'Saba & Savti', who: ['josh', 'esti'], kids: [] },
  { label: 'Friedman', who: ['efrat', 'aryeh'], kids: ['gavriel', 'eliora', 'yosefy'] },
  { label: 'Corn', who: ['abigail', 'chesky'], kids: ['ariel', 'amitai', 'eden'] },
  { label: 'Gelband', who: ['rina', 'yoni'], kids: ['mia', 'yael', 'yair'] },
  { label: 'Guedalia', who: ['hagai', 'orlee'], kids: ['tzuri', 'benaya'] },
  { label: 'At home', who: ['yishai', 'yoav', 'ayelet', 'judah', 'talia'], kids: [] }
];
const ADULTS = FAMS.flatMap(f => f.who);
const KIDS = FAMS.flatMap(f => f.kids);

let me = null, state = { drawn: [], wishes: {} }, shown = {};
try { me = localStorage.getItem('mm2026_me'); } catch (e) {}
if (me && !P[me]) me = null;

async function rpc(fn, args) {
  const r = await fetch(SB + '/rest/v1/rpc/' + fn, {
    method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {})
  });
  if (!r.ok) throw new Error('Server error ' + r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
async function refresh() {
  state = await rpc('mm_state');
  state.drawn = state.drawn || [];
  state.wishes = state.wishes || {};
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nm = id => P[id].name;
const famOf = id => FAMS.find(f => f.who.includes(id));

function setMe(id) {
  me = id;
  try { id ? localStorage.setItem('mm2026_me', id) : localStorage.removeItem('mm2026_me'); } catch (e) {}
  shown = {};
  render();
  window.scrollTo(0, 0);
}

function renderPick() {
  let h = '<div class="card"><h2 style="margin-top:0">Who are you?</h2><p class="note">Pick your name. Parents: you can draw for your kids too, on the next screen.</p>';
  for (const f of FAMS) {
    h += '<div class="fam">' + esc(f.label) + '</div><div class="who">';
    for (const id of f.who) h += '<button class="pick" data-me="' + id + '">' + esc(nm(id)) + (P[id].sub ? '<small>' + esc(P[id].sub) + '</small>' : '') + '</button>';
    h += '</div>';
  }
  return h + '</div>';
}

function drawCard(id, isKid) {
  const done = state.drawn.includes(id);
  const title = id === me ? 'Your draw' : nm(id) + '’s draw';
  const sub = id === me ? 'You buy a gift for the name you draw.' : 'Help ' + esc(nm(id)) + ' get a gift for the name drawn.';
  let body;
  if (shown[id]) {
    const w = state.wishes[shown[id]];
    body = '<div class="slot done" id="slot_' + id + '">🎁 ' + esc(nm(shown[id])) + '</div>' +
      '<div class="wishview' + (w ? '' : ' empty') + '">' + (w ? '<b>' + esc(nm(shown[id])) + '’s wish list:</b>\n' + esc(w) : esc(nm(shown[id])) + ' hasn’t written a wish list yet.') + '</div>' +
      '<div class="row"><button class="link" data-hide="' + id + '">Hide</button></div>';
  } else if (done) {
    body = '<div class="slot done" id="slot_' + id + '">✓ Name drawn</div><div class="row"><button class="primary" data-show="' + id + '">Show the name</button></div>';
  } else {
    body = '<div class="slot" id="slot_' + id + '">?</div><div class="row"><button class="primary" data-draw="' + id + '">🎲 Draw a name</button></div>';
  }
  return '<div class="card dcard"><h3>' + (isKid ? '🧒 ' : '') + esc(title) + '</h3><div class="sub">' + sub + '</div>' + body + '</div>';
}

function wishCard(id) {
  const label = id === me ? 'My wish list' : nm(id) + '’s wish list';
  return '<div class="card"><h3 style="margin:0 0 8px;font-size:16px">' + esc(label) + '</h3>' +
    '<textarea id="wish_' + id + '" placeholder="Ideas for a gift up to ₪15…">' + esc(state.wishes[id] || '') + '</textarea>' +
    '<div class="row"><button data-wish="' + id + '">Save</button><span class="saved" id="saved_' + id + '"></span></div></div>';
}

function renderMain() {
  const f = famOf(me);
  let h = '<div class="card hello"><div>Hi <b>' + esc(nm(me)) + '</b> 👋</div><button class="link" data-me="">Not ' + esc(nm(me)) + '?</button></div>';
  h += drawCard(me, false);
  for (const k of f.kids) h += drawCard(k, true);
  h += '<h2>Wish lists</h2><p class="note">Whoever draws your name sees your wish list.</p>';
  h += wishCard(me);
  for (const k of f.kids) h += wishCard(k);
  h += '<h2>Who has drawn</h2><div class="card"><div class="fam" style="margin-top:0">Adults</div><div class="status">' +
    ADULTS.map(id => '<span class="chip' + (state.drawn.includes(id) ? ' y' : '') + '">' + (state.drawn.includes(id) ? '✓ ' : '') + esc(nm(id)) + '</span>').join('') +
    '</div><div class="fam">Grandkids</div><div class="status">' +
    KIDS.map(id => '<span class="chip' + (state.drawn.includes(id) ? ' y' : '') + '">' + (state.drawn.includes(id) ? '✓ ' : '') + esc(nm(id)) + '</span>').join('') +
    '</div></div>';
  h += '<p class="note">Adults draw from Saba, Savti, the kids and their husbands and wives (never yourself or your spouse). Grandkids draw from the other grandkids (never a brother or sister).</p>';
  return h;
}

function render() {
  document.getElementById('app').innerHTML = me ? renderMain() : renderPick();
}

function confetti() {
  const cols = ['#2457c5', '#f3c55b', '#1a7f4b', '#e85d75', '#7fb3e8'];
  for (let i = 0; i < 60; i++) {
    const d = document.createElement('div');
    d.className = 'confetti';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.background = cols[i % cols.length];
    d.style.animationDuration = 1.6 + Math.random() * 1.6 + 's';
    d.style.animationDelay = Math.random() * 0.4 + 's';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 3800);
  }
}

async function doDraw(id) {
  const slot = document.getElementById('slot_' + id);
  const btn = document.querySelector('[data-draw="' + id + '"]');
  if (btn) btn.disabled = true;
  const pool = (KIDS.includes(id) ? KIDS : ADULTS).filter(x => x !== id);
  slot.classList.add('spin');
  let i = 0, spinning = true;
  const tick = () => { if (!spinning) return; slot.textContent = nm(pool[i++ % pool.length]); setTimeout(tick, 70 + Math.min(i, 30) * 4); };
  tick();
  try {
    const [r] = await Promise.all([rpc('mm_draw', { p_giver: id }), new Promise(res => setTimeout(res, 2200))]);
    spinning = false;
    if (!r) throw new Error('No name found');
    shown[id] = r;
    if (!state.drawn.includes(id)) state.drawn.push(id);
    try { await refresh(); } catch (e) {}
    render();
    confetti();
  } catch (e) {
    spinning = false;
    slot.classList.remove('spin');
    slot.innerHTML = '<span class="err" style="font-size:16px">Couldn’t draw. Check your connection and try again.</span>';
    if (btn) btn.disabled = false;
  }
}

async function doShow(id) {
  try { shown[id] = await rpc('mm_draw', { p_giver: id }); render(); } catch (e) { alert('Couldn’t load. Try again.'); }
}

async function doWish(id) {
  const t = document.getElementById('wish_' + id).value.trim();
  const s = document.getElementById('saved_' + id);
  s.textContent = 'Saving…';
  try { await rpc('mm_set_wish', { p_person: id, p_wish: t }); state.wishes[id] = t; s.textContent = '✓ Saved'; }
  catch (e) { s.textContent = ''; alert('Couldn’t save. Try again.'); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.me !== undefined) setMe(b.dataset.me || null);
  else if (b.dataset.draw) doDraw(b.dataset.draw);
  else if (b.dataset.show) doShow(b.dataset.show);
  else if (b.dataset.hide) { delete shown[b.dataset.hide]; render(); }
  else if (b.dataset.wish) doWish(b.dataset.wish);
});

(async () => {
  try { await refresh(); render(); }
  catch (e) { document.getElementById('app').innerHTML = '<div class="card err">Couldn’t connect. Please refresh the page.</div>'; }
})();
</script>
</body>
</html>
